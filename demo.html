<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentData API</title><style>body{font:16px system-ui;background:#f3f5f9;color:#18243a;padding:25px}main{max-width:720px;margin:auto;background:white;padding:28px;border-radius:16px}textarea,select,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:8px 0 20px}button{background:#1748c6;color:white;border:0;cursor:pointer}pre{background:#edf1f7;padding:16px;white-space:pre-wrap;overflow:auto}</style><main><h1>AgentData API</h1><p>Demo gratuita: validação de CPF/CNPJ, telefones e CSV para JSON. Sem pagamentos habilitados. Use dados fictícios.</p><label>Função</label><select id="action"><option value="/validate/cpf">Validar CPF</option><option value="/validate/cnpj">Validar CNPJ</option><option value="/normalize/phone">Normalizar telefone</option><option value="/convert/csv-json">CSV para JSON</option></select><label>Entrada</label><textarea id="data">529.982.247-25</textarea><button id="run">Executar</button><h2>Resposta</h2><pre id="result">Aguardando teste</pre><a href="/docs">Documentação</a> · <a href="/catalog">Catálogo</a> · <a href="/health">Status</a></main><script>const a=document.querySelector('#action'),d=document.querySelector('#data'),r=document.querySelector('#result');const samples={'/validate/cpf':'529.982.247-25','/validate/cnpj':'11.222.333/0001-81','/normalize/phone':'(11) 99999-8888','/convert/csv-json':'name,age\nAna,20'};a.onchange=()=>d.value=samples[a.value];document.querySelector('#run').onclick=async()=>{r.textContent='Executando...';try{const body=a.value.includes('csv-json')?{csv_text:d.value}:{value:d.value};const res=await fetch(a.value,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});r.textContent=JSON.stringify({status:res.status,result:await res.json()},null,2)}catch(e){r.textContent=String(e)}}</script></html>
